name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false  # No external dependencies

      - name: Build binaries
        run: make build-all

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.46.3
        run: |
          curl -sSL -o /tmp/nfpm.deb "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build Linux packages
        run: make packages

      # One checksums file is the single source of truth for every downstream
      # consumer: install.sh, `csm -upgrade`, the Homebrew formula below, and
      # the AUR PKGBUILD. Hashing the same binaries separately in each place is
      # how those four drift apart.
      - name: Generate checksums
        run: make checksums

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/csm-darwin-amd64
            dist/csm-darwin-arm64
            dist/csm-linux-amd64
            dist/csm-linux-arm64
            dist/csm_*_amd64.deb
            dist/csm_*_arm64.deb
            dist/csm-*.x86_64.rpm
            dist/csm-*.aarch64.rpm
            dist/checksums.txt
          generate_release_notes: true

      # Update the Homebrew formula directly from the binaries we just built,
      # rather than firing a repository_dispatch that makes the tap re-download
      # and re-hash them. This keeps the whole release in one workflow with one
      # token (HOMEBREW_TAP_PAT, scoped to the tap's contents), so there is no
      # second secret in the tap repo to fall out of sync on rotation.
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          BASE_URL="https://github.com/yepzdk/claude-sessions-monitor/releases/download/${TAG_NAME}"

          # Read the hashes out of checksums.txt rather than recomputing them,
          # so the formula and the file users verify against can never disagree.
          #
          # The empty check is what makes a missing entry stop the release. awk
          # prints nothing for a name it cannot find, and `set -u` does not fire
          # on the assignment below because assigning an empty value succeeds --
          # so without this the formula is committed and pushed with sha256 "",
          # breaking every `brew install csm` until someone notices.
          #
          # This works because every call site below is a plain assignment: the
          # exit runs in the substitution subshell and `set -e` then aborts on
          # the failed assignment. Embedding a call in a larger command (echo
          # "$(sha …)") would swallow it -- keep the assignment form.
          sha() {
            s=$(awk -v n="$1" '$2 == n { print $1 }' dist/checksums.txt)
            [ -n "$s" ] || { echo "checksums.txt has no entry for $1" >&2; exit 1; }
            echo "$s"
          }
          sha_darwin_arm64=$(sha csm-darwin-arm64)
          sha_darwin_amd64=$(sha csm-darwin-amd64)
          sha_linux_arm64=$(sha csm-linux-arm64)
          sha_linux_amd64=$(sha csm-linux-amd64)

          # Clone the tap using the PAT this workflow already holds.
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/yepzdk/homebrew-tools.git" tap
          cd tap

          # Heredoc body is left-aligned on purpose: cat writes it verbatim, so
          # any leading indentation would end up in the committed formula.
          cat > Formula/csm.rb <<FORMULA_EOF
          class Csm < Formula
            desc "CLI tool to monitor Claude Code sessions"
            homepage "https://github.com/yepzdk/claude-sessions-monitor"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/csm-darwin-arm64"
                sha256 "${sha_darwin_arm64}"
              end
              on_intel do
                url "${BASE_URL}/csm-darwin-amd64"
                sha256 "${sha_darwin_amd64}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/csm-linux-arm64"
                sha256 "${sha_linux_arm64}"
              end
              on_intel do
                url "${BASE_URL}/csm-linux-amd64"
                sha256 "${sha_linux_amd64}"
              end
            end

            def install
              bin.install Dir["*"].first => "csm"
            end

            test do
              assert_match "csm version", shell_output("#{bin}/csm -v")
            end
          end
          FORMULA_EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/csm.rb
          # No-op releases (re-run on an unchanged formula) are a clean success,
          # not a failed commit.
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date for ${TAG_NAME}"
          else
            git commit -m "Update csm formula to ${TAG_NAME}"
            git push
            echo "Homebrew formula updated to ${TAG_NAME}"
          fi

  # Publishing to the AUR needs an Arch environment: makepkg generates the
  # .SRCINFO the AUR requires, and it exists nowhere else.
  #
  # This job is dormant until AUR_SSH_KEY is set. A missing secret is not a
  # failed release -- it is a release on a repo that has not been connected to
  # the AUR yet -- so the step reports that and stops rather than turning every
  # release red.
  aur:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        # -Syu, not -Sy: refreshing the database and then installing against
        # a not-upgraded root is a partial upgrade, which Arch warns breaks
        # systems. In a throwaway container it usually survives, and when it
        # does not it fails mid-release with a libc mismatch that has nothing
        # to do with csm.
        run: pacman -Syu --noconfirm git openssh curl

      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish csm-bin to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${AUR_SSH_KEY}" ]; then
            echo "AUR_SSH_KEY is not set — skipping the AUR publish."
            echo "See CLAUDE.md (Release Workflow > AUR) for how to enable it."
            exit 0
          fi

          VERSION="${TAG_NAME#v}"

          # The release job already published checksums.txt; reuse it rather
          # than re-hashing, so the AUR package vouches for the same bytes as
          # install.sh and the Homebrew formula.
          curl -fsSL -o checksums.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/checksums.txt"

          mkdir -p aur && cd aur
          ../packaging/aur/render.sh "${VERSION}" ../checksums.txt ../LICENSE > PKGBUILD

          # makepkg refuses to run as root, and the container is root.
          useradd -m builder
          chown -R builder .
          su builder -c "makepkg --printsrcinfo" > .SRCINFO

          mkdir -p ~/.ssh
          echo "${AUR_SSH_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

          git clone ssh://aur@aur.archlinux.org/csm-bin.git repo
          cp PKGBUILD .SRCINFO repo/
          cd repo
          git add PKGBUILD .SRCINFO
          # Re-running a release on an unchanged package is a clean success.
          if git diff --cached --quiet; then
            echo "AUR package already up to date for ${TAG_NAME}"
          else
            git commit -m "Update to ${TAG_NAME}"
            git push
            echo "AUR csm-bin updated to ${TAG_NAME}"
          fi
