name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Both platforms: internal/jump and origin detection are split by build
    # tag, and a Linux-only run never compiles or tests the darwin half.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      # gofmt is not advisory in Go — there is one canonical formatting, so an
      # unformatted file is a defect, not a preference. Enforcing it here keeps
      # alignment churn (struct tags, map literals) out of feature diffs.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ."
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Pinned to match the Makefile. The action downloads a prebuilt binary,
      # so the Go version above does not have to satisfy golangci-lint's own
      # build requirement.
      - name: Lint (linux)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
        env:
          GOOS: linux
          GOARCH: amd64

      # Build tags hide code from a single pass: internal/jump's real
      # implementation is darwin-only, so the run above type-checks a stub
      # instead of the ~200 lines that do the work.
      #
      # The action's cache key carries no GOOS, so saving here would collide
      # with what the step above already stored under that key.
      - name: Lint (darwin)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          skip-save-cache: true
        env:
          GOOS: darwin
          GOARCH: arm64

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
